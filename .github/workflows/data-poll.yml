name: Weekly Data Poll

on:
  schedule:
    # Primary weekly poll.
    - cron: '0 6 * * 6'   # Sat 06:00 UTC
    # Decaying retry ladder at roughly +1h, +8h, +16h, +32h from the primary.
    # GitHub Actions cannot self-schedule a delayed re-run, and sleeping inside
    # a job is not an option (6h job cap, and it bills runner minutes for
    # doing nothing). So the retries are ordinary cron entries, made cheap by
    # the `plan` job below: on a retry fire it polls ONLY the sources whose
    # most recent completed run failed. If the primary succeeded, every retry
    # resolves to an empty matrix and the poll job is skipped entirely.
    - cron: '0 7 * * 6'   # +1h   Sat 07:00
    - cron: '0 14 * * 6'  # +8h   Sat 14:00
    - cron: '0 22 * * 6'  # +16h  Sat 22:00
    - cron: '0 14 * * 0'  # +32h  Sun 14:00
  workflow_dispatch:
    inputs:
      source:
        description: 'Single source to poll (leave blank for all)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - kalshi
          - ecb
          - guardian
          - commodities
          - cboe_vol
          - macro
          - intl_vol
      dry_run_publish:
        description: 'Print the HF upload command instead of running it'
        required: false
        default: false
        type: boolean

permissions:
  contents: write  # Required for git push to main branch
  actions: read    # Required by the `plan` job to read prior run conclusions

jobs:
  # Decides which sources this run should poll. All the retry logic lives
  # here so the poll job itself is unchanged and unaware.
  #
  #   primary cron / dispatch with no input -> every source
  #   dispatch with a source input          -> that source only
  #   retry cron                            -> only sources whose most recent
  #                                            completed run FAILED
  plan:
    runs-on: ubuntu-latest
    outputs:
      sources: ${{ steps.select.outputs.sources }}
    steps:
      - id: select
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          # ecb/guardian/cboe_vol need no auth; commodities needs FRED_API_KEY.
          # macro + cboe_vol + intl_vol are the three components of
          # macro_daily.parquet (#619). They were never polled, which is why
          # that dataset sat frozen at its 2026-04 seed.
          ALL_SOURCES: 'kalshi ecb guardian commodities cboe_vol macro intl_vol'
          PRIMARY_CRON: '0 6 * * 6'
          EVENT_NAME: ${{ github.event_name }}
          EVENT_CRON: ${{ github.event.schedule }}
          INPUT_SOURCE: ${{ github.event.inputs.source }}
        run: |
          set -euo pipefail

          json_array() {
            printf '%s' "$1" | tr ' ' '\n' | grep -v '^$' \
              | jq -R . | jq -sc .
          }

          # 1. Manual dispatch naming a single source.
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${INPUT_SOURCE:-}" ]; then
            echo "Manual dispatch for single source: $INPUT_SOURCE"
            echo "sources=$(json_array "$INPUT_SOURCE")" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2. Primary cron, or dispatch with no source -> everything.
          if [ "$EVENT_NAME" != "schedule" ] || [ "$EVENT_CRON" = "$PRIMARY_CRON" ]; then
            echo "Full poll of all sources."
            echo "sources=$(json_array "$ALL_SOURCES")" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 3. Retry cron -> only sources that have not succeeded this cycle.
          #
          # Look back 40h, which spans the primary fire and every retry slot
          # without reaching the previous week's run.
          since=$(date -u -d '40 hours ago' +%Y-%m-%dT%H:%M:%SZ)
          echo "Retry fire ($EVENT_CRON). Checking runs since $since."

          run_ids=$(gh run list --repo "$REPO" --workflow=data-poll.yml \
                      --limit 40 --json databaseId,createdAt,status \
                      --jq '.[] | select(.status == "completed")
                                | select(.createdAt > "'"$since"'")
                                | .databaseId')

          needed=''
          for src in $ALL_SOURCES; do
            ok=no
            for id in $run_ids; do
              concl=$(gh run view "$id" --repo "$REPO" --json jobs \
                        --jq '[.jobs[] | select(.name == "poll ('"$src"')") | .conclusion] | first // ""')
              if [ "$concl" = "success" ]; then
                ok=yes
                break
              fi
            done
            if [ "$ok" = "yes" ]; then
              echo "  $src: already succeeded this cycle, skipping"
            else
              echo "  $src: no successful run this cycle, will retry"
              needed="$needed $src"
            fi
          done

          echo "sources=$(json_array "$needed")" >> "$GITHUB_OUTPUT"

  poll:
    needs: plan
    # An empty matrix is a hard error in Actions, and it is also the common
    # case on a retry fire after a clean primary run. Skip instead.
    if: needs.plan.outputs.sources != '[]'
    runs-on: ubuntu-latest
    # Allow individual sources to fail without blocking others
    strategy:
      fail-fast: false
      matrix:
        source: ${{ fromJSON(needs.plan.outputs.sources) }}

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libuv1-dev

      - name: Ensure data directory exists
        run: mkdir -p data/raw

      - name: Install R dependencies
        shell: Rscript {0}
        run: |
          # The fetch scripts call pkgload::load_all() on packages/historicaldata,
          # which hard-fails if any DESCRIPTION Import is absent. Keeping a
          # hand-written list in sync with DESCRIPTION does not work: adding
          # `digest` there (historical#598) broke this job on the next scheduled
          # run, because only one of the two lists was updated.
          #
          # So derive the package's Imports from DESCRIPTION and union them with
          # the extras that only the fetch scripts need. The literal list is
          # retained as a floor, so a DESCRIPTION parse failure degrades to the
          # previous behaviour rather than installing nothing.
          script_deps <- c(
            "jsonlite", "arrow", "dplyr", "cli", "here",
            "httr2", "tibble", "tidyr", "purrr", "quantmod", "pkgload",
            "DBI", "duckdb", "duckplyr", "ggplot2",
            "lubridate", "slider", "rlang", "digest"
          )

          pkg_imports <- tryCatch({
            dcf <- read.dcf("packages/historicaldata/DESCRIPTION", fields = "Imports")
            raw <- dcf[1L, 1L]
            if (is.na(raw)) character(0) else {
              x <- strsplit(raw, ",")[[1]]
              trimws(sub("\\(.*\\)", "", x))
            }
          }, error = function(e) {
            message("DESCRIPTION parse failed, falling back to literal list: ",
                    conditionMessage(e))
            character(0)
          })

          # base/recommended packages ship with R; installing them is wasteful
          # and `base`/`stats` are not on CRAN at all.
          base_pkgs <- rownames(installed.packages(priority = "base"))
          need <- setdiff(unique(c(script_deps, pkg_imports)), c(base_pkgs, ""))

          message("Installing ", length(need), " packages: ",
                  paste(sort(need), collapse = ", "))
          # r-lib/actions/setup-r exports RSPM — the Posit Package Manager
          # binary repo matching this runner's Ubuntu release. Hardcoding
          # cloud.r-project.org discards it, and cloud serves SOURCE tarballs
          # only for Linux, so every package (duckdb, arrow, duckplyr, ggplot2)
          # compiles from scratch. Measured on run 30691340071: the install
          # step took ~51 minutes. Binaries take ~2.
          repos <- Sys.getenv("RSPM", unset = "")
          if (!nzchar(repos)) {
            repos <- "https://cloud.r-project.org"
            message("RSPM unset — falling back to CRAN source packages.")
          }
          message("Installing from: ", repos)

          install.packages(need, repos = repos)

          # Fail loudly here rather than 20 lines later inside load_all().
          missing <- need[!need %in% rownames(installed.packages())]
          if (length(missing) > 0L) {
            stop("Failed to install: ", paste(missing, collapse = ", "))
          }

      - name: Run fetch script
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
        run: Rscript scripts/fetch_${{ matrix.source }}.R

      - name: Commit if data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f data/raw/
          if ! git diff --cached --quiet; then
            git commit -m "data: ${{ matrix.source }} $(date +%Y-%m-%d)"
            git pull --rebase origin ${{ github.ref_name }}
            git push
          fi

  # Rebuilds macro_daily.parquet from the three components the poll now
  # refreshes, and publishes it to HuggingFace — the missing "last mile" that
  # left that dataset frozen at its 2026-05-06 seed (#619).
  #
  # PUBLISHING IS GATED ON THE SECRET. With no HF_TOKEN configured this job
  # builds the parquet, uploads nothing, and says so. Adding that secret is the
  # deliberate act of authorising publication — not merging this workflow.
  publish-macro-daily:
    needs: poll
    if: needs.poll.result == 'success'
    runs-on: ubuntu-latest
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      # Fail in seconds, not after ~4 minutes of setup + build (#705). An
      # empty HF_TOKEN keeps the existing graceful "not configured" path
      # below untouched; a SET token that whoami-v2 rejects (expired,
      # revoked, wrong scope) means the build that follows is wasted work —
      # the parquet cannot be published either way, so stop before spending
      # runner minutes on setup-r/apt-get/R-install/build_macro_daily.R.
      #
      # Also warns (does not fail) when a valid token is close to expiring
      # (#705 Problem 2), so rotation happens on a schedule instead of on
      # the next scheduled run's failure. whoami-v2's response carries an
      # `auth.expiresAt` ISO-8601 field for tokens created WITH an expiry —
      # confirmed against huggingface.js's own AuthInfo type
      # (packages/hub/src/lib/who-am-i.ts, the official JS client's typed
      # mirror of this exact endpoint's `auth` object: `type`,
      # `accessToken`, `expiresAt`), since testing against the live field
      # would require a real token, which this preflight is explicitly not
      # given. A token created WITHOUT an expiry omits the field — jq's
      # `// empty` renders that as "no expiry", not an error.
      - name: Preflight — validate HF_TOKEN before any build work
        if: env.HF_TOKEN != ''
        env:
          HF_TOKEN_EXPIRY_WARN_DAYS: '30'
        run: |
          set -euo pipefail
          # Body IS captured now (needed for the expiry field below) but is
          # never echoed or logged anywhere — only the two fields pulled out
          # via jq (http status, auth.expiresAt) ever reach a log line. No
          # -v, no echo of $HF_TOKEN, no echo of $body. -H passes the token
          # but the value is masked by Actions' log redaction regardless.
          response=$(curl -s -w '\n%{http_code}' \
            -H "Authorization: Bearer ${HF_TOKEN}" \
            https://huggingface.co/api/whoami-v2)
          status="${response##*$'\n'}"
          body="${response%$'\n'*}"
          if [ "$status" != "200" ]; then
            echo "::error::HF_TOKEN is invalid or expired — https://huggingface.co/api/whoami-v2 returned HTTP $status instead of 200. Publishing to HuggingFace would fail with this token, so failing now rather than after ~4 minutes of setup and build. Rotate it: (1) generate a new token with write access to JohnGavin/finance-data at https://huggingface.co/settings/tokens, (2) gh secret set HF_TOKEN --repo JohnGavin/historical."
            exit 1
          fi
          echo "HF_TOKEN preflight OK — whoami-v2 returned 200."

          expires_at=$(printf '%s' "$body" | jq -r '.auth.expiresAt // empty' 2>/dev/null || true)
          if [ -z "$expires_at" ] || [ "$expires_at" = "null" ]; then
            echo "HF_TOKEN preflight: no expiry set on this token (or the field was absent from the API response) — nothing to warn about."
          else
            expires_epoch=$(date -u -d "$expires_at" +%s 2>/dev/null || echo '')
            if [ -z "$expires_epoch" ]; then
              echo "::notice::HF_TOKEN preflight: whoami-v2 returned an auth.expiresAt value that could not be parsed as a date ($expires_at). Skipping the expiry-warning check; token itself is still valid (HTTP 200 above)."
            else
              now_epoch=$(date -u +%s)
              days_left=$(( (expires_epoch - now_epoch) / 86400 ))
              if [ "$days_left" -le "$HF_TOKEN_EXPIRY_WARN_DAYS" ]; then
                echo "::warning::HF_TOKEN expires in ${days_left} day(s) ($expires_at). Rotate it before it fails a scheduled run: (1) generate a new token with write access to JohnGavin/finance-data at https://huggingface.co/settings/tokens, (2) gh secret set HF_TOKEN --repo JohnGavin/historical."
              else
                echo "HF_TOKEN preflight: expires in ${days_left} day(s) ($expires_at) — beyond the ${HF_TOKEN_EXPIRY_WARN_DAYS}-day warning window, no action needed yet."
              fi
            fi
          fi

      # The poll jobs commit their parquets during this same run, so the
      # checkout above predates them.
      - name: Pull the parquets the poll just committed
        run: git pull --ff-only origin ${{ github.ref_name }}

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libuv1-dev

      - name: Install R dependencies
        shell: Rscript {0}
        run: |
          repos <- Sys.getenv("RSPM", unset = "")
          if (!nzchar(repos)) repos <- "https://cloud.r-project.org"
          message("Installing from: ", repos)
          install.packages(c("arrow", "dplyr", "cli", "here", "tibble", "purrr"),
                           repos = repos)

      - name: Build macro_daily.parquet
        run: Rscript scripts/build_macro_daily.R

      - name: Install HuggingFace CLI
        if: env.HF_TOKEN != ''
        run: pip install --quiet --upgrade huggingface_hub

      - name: Publish to HuggingFace
        if: env.HF_TOKEN != ''
        env:
          DRYRUN: ${{ github.event.inputs.dry_run_publish == 'true' && '1' || '' }}
        run: |
          bash scripts/upload_hf.sh \
            data/raw/macro_daily.parquet \
            macro_daily.parquet \
            "data: macro_daily refresh ($(date -u +%Y-%m-%d)) — #619"

      - name: Report when publishing is not configured
        if: env.HF_TOKEN == ''
        run: |
          echo "::notice::macro_daily.parquet built but NOT published — HF_TOKEN is not configured."
          echo "Add HF_TOKEN to repository secrets to enable publishing (see #619)."
