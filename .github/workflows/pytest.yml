name: Python Tests

on:
  push:
    paths:
      - 'scripts/**.py'
      - 'tests/test_**.py'
      - '.github/workflows/pytest.yml'
  pull_request:
    paths:
      - 'scripts/**.py'
      - 'tests/test_**.py'
      - '.github/workflows/pytest.yml'
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: pip install pytest

      - name: Run pytest
        run: pytest tests/test_fetch_metadata.py -v
