name: R Package Tests

on:
  push:
    paths:
      - 'packages/historicaldata/**'
      - '.github/workflows/r-tests.yml'
  pull_request:
    paths:
      - 'packages/historicaldata/**'
      - '.github/workflows/r-tests.yml'
  workflow_dispatch:

jobs:
  r-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main

      # NOTE: magic-nix-cache-action removed — it is sunset/rate-limited and
      # was disabling the substituter in CI (HTTP 418 / ResourceExhausted),
      # breaking package fetches. We rely on the rstats-on-nix Cachix +
      # cache.nixos.org substituters configured below instead.
      - name: Configure Nix binary cache
        run: |
          mkdir -p ~/.config/nix
          echo "extra-substituters = https://rstats-on-nix.cachix.org" >> ~/.config/nix/nix.conf
          echo "extra-trusted-public-keys = rstats-on-nix.cachix.org-1:vdiiVgocg6WeJrODIqdprZRUrhi1JzhBnXv7aWI6+F0=" >> ~/.config/nix/nix.conf

      - name: Run R package tests
        run: |
          nix develop --command bash -c 'cd packages/historicaldata && Rscript -e "devtools::test(stop_on_failure = TRUE)"'
