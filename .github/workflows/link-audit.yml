name: Link audit (lychee)

# Closes #344. Catches deep-link / anchor-fragment / inbound-href breakage
# that the manual URL-status sweep missed (e.g., examples.html#equity 404
# from a homepage card after examples.qmd was archived).
#
# Two trigger modes:
#   - daily (cron): full re-crawl of the deployed Pages site
#   - on push to main touching docs/: in-repo crawl of docs/*.html before deploy
#
# lychee is pinned via flake.nix (additional-tools) so version is stable across
# dev and CI (#392). .lycheeignore handles DOI/publisher-wall bot-blocks.

on:
  schedule:
    - cron: '17 6 * * *'      # daily at 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/link-audit.yml'

permissions:
  contents: read
  issues: write               # to auto-file an issue on failure

jobs:
  link-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # lychee auto-detects GITHUB_TOKEN and checks github.com links via the
    # GitHub API instead of scraping HTML blob/ pages. This avoids the
    # intermittent 500/429 responses GitHub returns on HTML endpoints under
    # load, which previously failed the whole audit on a valid link (#473).
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            trusted-users = root runner
            extra-substituters = https://rstats-on-nix.cachix.org
            extra-trusted-public-keys = rstats-on-nix.cachix.org-1:vdiiVgocg6WeJrODIqdprZRUrhi1JzhBnXv7aWI6+F0=

      # Retry budget (both steps, #703): lychee --help documents
      # --retry-wait-time only as "Minimum wait time in seconds between
      # retries of failed requests" — it does not document an exponential
      # backoff schedule on top of that minimum, so we do not assume one.
      # wait-time=5 with max-retries=3 guarantees a floor of ~15s spent
      # retrying a failing link before it's given up on (possibly more, if
      # lychee backs off further — --help is silent on that).
      - name: Lychee — in-repo HTML pre-deploy check
        if: github.event_name == 'push'
        run: |
          nix develop --command lychee \
            --no-progress \
            --verbose \
            --max-redirects 5 \
            --max-concurrency 8 \
            --max-retries 3 \
            --retry-wait-time 5 \
            --accept 200,206,403,429 \
            --output ./lychee-out.md \
            --format markdown \
            './docs/**/*.html' \
            './docs/**/*.qmd' \
            './*.md'

      # --max-concurrency lowered to 2 for THIS step only (live crawl against
      # a single host, johngavin.github.io). #703's failure was a single 503
      # on our own Pages origin among 455 checks fanning out from 9 seed
      # pages — consistent with, but not confirmed as, our own crawl
      # rate-limiting the origin; this is a precaution against a SUSPECTED
      # cause on one observed sample, not a proven fix. Falsification: if a
      # future scheduled run still 503s on this asset despite the larger
      # retry budget above, the rate-limit theory is wrong and the cause
      # lies elsewhere (see PR body).
      - name: Lychee — live Pages crawl (scheduled / manual)
        if: github.event_name != 'push'
        run: |
          nix develop --command lychee \
            --no-progress \
            --verbose \
            --max-redirects 5 \
            --max-concurrency 2 \
            --max-retries 3 \
            --retry-wait-time 5 \
            --accept 200,206,403,429 \
            --output ./lychee-out.md \
            --format markdown \
            --base-url 'https://johngavin.github.io/historical/' \
            'https://johngavin.github.io/historical/' \
            'https://johngavin.github.io/historical/leaderboard.html' \
            'https://johngavin.github.io/historical/falsification.html' \
            'https://johngavin.github.io/historical/stock-backtest.html' \
            'https://johngavin.github.io/historical/avoid-worst-days.html' \
            'https://johngavin.github.io/historical/macro-defense-rotation.html' \
            'https://johngavin.github.io/historical/evidence.html' \
            'https://johngavin.github.io/historical/quiz.html' \
            'https://johngavin.github.io/historical/european-overlay.html'

      - name: Upload lychee report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lychee-output
          path: ./lychee-out.md
          retention-days: 14

      - name: Create issue on schedule failure
        if: failure() && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "link-audit: broken links detected on Pages site"
          content-filepath: ./lychee-out.md
          labels: bug, deploy, link-audit
