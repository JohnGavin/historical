name: Dashboard freshness (weekly)

# Enforcement half of #695's escalation policy. Detection has existed since
# #698 (scripts/check_dashboard_freshness.R); nothing ran it on a schedule or
# failed on it until this workflow. HD_FAIL_ON_STALE_DASHBOARDS escalates
# Check 2 and Check 3 differently (see that script's own header comment,
# section "ESCALATION POLICY", for the full rationale):
#   - Check 2 (source staleness -- a page's .qmd committed newer than its own
#     .html) gets ZERO grace: a human edited a page and it never reached
#     readers, which is wrong the moment it happens.
#   - Check 3 (data staleness -- the pipeline rebuilt after a page rendered)
#     gets a configurable grace period, HD_STALE_DASHBOARD_DATA_THRESHOLD_DAYS
#     (default 14 days). Measured 2026-08-22: two pages became data-stale
#     within 45.9 hours of a routine tar_make() that touched none of their
#     own source -- a zero-grace threshold there would be permanently red.
#
# WEEKLY, NOT DAILY: re-rendering a stale page is a ~20-minute human act
# (#695's own evidence -- the 9 pages flagged when this policy was written
# took ~20 minutes of wall clock to re-render). A daily nag would arrive
# faster than anyone could reasonably act on it and would be muted within a
# fortnight -- the same fate #695 itself documents for a check nobody reads.
# Monday morning gives the whole working week to act on whatever the
# previous week left stale, mirroring link-audit.yml's own daily cadence but
# scaled to a check whose fix is a deliberate human action (re-render +
# review + commit), not link-audit's usually-passive "the target link came
# back" or "fix the URL".
#
# CHECK 3 (DATA STALENESS) NOW RUNS HERE, VIA A COMMITTED SNAPSHOT (#695
# Check 3 CI gap, closed). It still needs SOME source of tar_meta() build
# times, and a GitHub Actions runner still starts with no store -- building
# one here to run Check 3 would still mean running tar_make() against
# docs/_targets.R on every scheduled run (real wall-clock cost, well past
# sensible workflow budgets) AND would still produce a store that is NOT the
# main checkout's (see .claude/CLAUDE.md and the worktree-location rule for
# why a second, unofficial store must never race the canonical one; this is
# still true and this workflow still never runs tar_make()).
#
# The fix instead is exactly the "theoretical way" this comment used to
# describe as out of scope: scripts/build.sh, immediately after a clean
# tar_make() + scripts/check_pipeline_errors.R (main checkout only), now
# also runs scripts/write_targets_meta_snapshot.R, which writes a small,
# deterministic, COMMITTABLE snapshot of every target's name + tar_meta()
# build time to docs/_targets_meta_snapshot.csv. A human reviews and commits
# that file the same way they already review and commit `--render` output --
# scripts/build.sh never commits or pushes it itself.
# scripts/check_dashboard_freshness.R's Check 3 section reads this
# COMMITTED file (checked out here like any other repo file) whenever no
# live store exists, which is unconditionally true on this runner -- see
# that script's "Metadata snapshot" section header comment for the full
# read/write design.
#
# THE SNAPSHOT'S OWN AGE IS ITSELF PART OF WHAT THIS WORKFLOW ENFORCES. If
# nobody runs `scripts/build.sh` in the main checkout, docs/_targets_meta_snapshot.csv
# freezes -- and a Check 3 that silently compared page render times against
# arbitrarily old reference data would report "fresh" forever, exactly the
# failure mode this whole policy exists to catch. So
# check_dashboard_freshness.R treats a snapshot older than
# HD_STALE_DASHBOARD_DATA_THRESHOLD_DAYS (the SAME threshold Check 3 uses
# for ordinary data staleness) as UNTRUSTWORTHY: Check 3 does not run at all
# in that case, and the step below fails (exit 2, not gated behind
# HD_FAIL_ON_STALE_DASHBOARDS -- an untrustworthy data source is the same
# class of failure as "no data source at all"). The failure message always
# names `scripts/build.sh` as the fix, because the problem is never "the
# check is broken", only "nobody ran the one command that refreshes this
# file's reference data" -- the intended effect of enabling Check 3 here is
# that this workflow now ALSO enforces "someone ran scripts/build.sh
# recently enough", not just "no dead references, no unpublished source
# edits".
#
# Treat a green run here as "no dead target references, no unpublished
# source edits, AND no dashboard's own referenced data is stale beyond the
# configured grace period, as of the last time a human ran `scripts/build.sh`
# in the main checkout and committed its snapshot".

on:
  schedule:
    - cron: '0 8 * * 1'      # weekly, Monday 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write               # to auto-file an issue on failure

jobs:
  dashboard-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            trusted-users = root runner
            extra-substituters = https://rstats-on-nix.cachix.org
            extra-trusted-public-keys = rstats-on-nix.cachix.org-1:vdiiVgocg6WeJrODIqdprZRUrhi1JzhBnXv7aWI6+F0=

      # Check 1 + Check 2 + Check 3 -- no store, no tar_make(). Check 3 (data
      # staleness) now runs via the committed docs/_targets_meta_snapshot.csv
      # fallback (--data-staleness); see header comment above and
      # scripts/check_dashboard_freshness.R's "Metadata snapshot" section for
      # the full design. HD_FAIL_ON_STALE_DASHBOARDS escalates Check 2 (zero
      # grace) and Check 3 (HD_STALE_DASHBOARD_DATA_THRESHOLD_DAYS grace,
      # default 14 days); Check 1 (dead target references) is always a hard
      # failure regardless of this env var, and an over-age or missing
      # snapshot is always a hard failure regardless of this env var too (see
      # header comment).
      - name: Check 1 (dead target refs) + Check 2 (source staleness) + Check 3 (data staleness, via snapshot)
        env:
          HD_FAIL_ON_STALE_DASHBOARDS: "1"
        run: |
          nix develop --command Rscript scripts/check_dashboard_freshness.R --data-staleness \
            | tee ./dashboard-freshness-out.md

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-freshness-output
          path: ./dashboard-freshness-out.md
          retention-days: 14

      - name: Create issue on schedule failure
        if: failure() && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "dashboard-freshness: dead reference or unpublished source edit detected"
          content-filepath: ./dashboard-freshness-out.md
          labels: bug, theme:infra, dashboard-freshness
