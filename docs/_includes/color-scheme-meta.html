<!-- Shared color-scheme signal (accessibility rule Part 2 Clause 0, historical#0b412a9c).
     Static value is always "dark" -- that is what
     ~/.claude/scripts/check_dashboard_color_scheme.sh greps for in the
     docs/_quarto.yml post-render gate. Pages with a light theme keep this
     in sync with the ACTUAL active theme at runtime via a MutationObserver
     in vignette-shared.js; ANY color-scheme declaration suppresses
     Chrome's Auto Dark Mode heuristic regardless of its value, so this
     static default never causes Chrome to invert the page. -->
<meta name="color-scheme" content="dark" />
<style>:root, html, body { color-scheme: dark; }</style>
